[project]
name = "msai-server"
version = "0.0.0"
description = "Minesweeper AI server: FastAPI + DB + (M4+) PyTorch training"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "numpy>=1.26",
  "websockets>=12",
]
# NOTE: torch is intentionally NOT listed here. Install the CUDA build separately so
# pip/uv doesn't pull a CPU wheel from PyPI (로컬환경 가이드 §2):
#   uv pip install torch --index-url https://download.pytorch.org/whl/cu124

[project.optional-dependencies]
# Postgres driver for CI/production (dev uses the stdlib sqlite3 driver).
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "rich>=13"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
# `trainer*` matches nothing until M4 lands; that is fine for setuptools find.
include = ["app*", "trainer*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic-generated migration scripts are machine-written; don't lint/format them.
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI uses these as argument-default sentinels by design (not a B008 bug).
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Header",
  "fastapi.Path",
  "fastapi.Body",
]
